<button class="track-item" (click)="playTrack()">
  <div class="ml-4">{{ trackNumber() }}.</div>
  <div class="track-item-info ml-4">
    <p>{{ track().title }}</p>
    @if (track().artist) {
      <p>{{ track().artist }}</p>
    }
  </div>
  <div class="track-item-duration">
    <p>{{ track().duration | date: 'mm:ss' }}</p>
  </div>
</button>
