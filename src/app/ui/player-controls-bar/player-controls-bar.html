<div class="player-controls-bar">
  <div class="twilight-bar-section" [class.open]="showTwilightBar()">
    <tw-twilight-bar />
  </div>
  <tw-playback-progress-bar />
  <div class="player-controls">
    <div class="player-controls-start">
      <button class="player-controls-button" (click)="sideMenuState.toggleSideMenu()">
        <i class="fas fa-bars" [class.disabled-icon]="!sideMenuState.isOpen()"></i>
      </button>
      <button class="player-controls-button" (click)="switchRepeatMode()">
        <i class="fas fad" [class]="repeatIcon()"></i>
      </button>
      <button class="player-controls-button" (click)="switchShuffleMode()">
        <i class="fas fa-random" [class]="shuffleIcon()"></i>
      </button>
    </div>

    <div class="player-controls-center">
      <button class="player-controls-button" (click)="playPrevious()">
        <i class="fas fa-backward-step"></i>
      </button>
      <button class="player-controls-button play-button" (click)="playAudio()">
        @if (isPlaying()) {
          <i class="fas fa-pause"></i>
        } @else {
          <i class="fas fa-play"></i>
        }
      </button>
      <button class="player-controls-button" (click)="playNext()">
        <i class="fas fa-forward-step"></i>
      </button>
    </div>

    <div class="player-controls-end">
      <div class="track-progress">
        @if (trackProgress() && trackDuration()) {
          <p>
            {{ trackProgress() / playbackService.playbackRate | date: 'mm:ss' }} /
            {{ trackDuration() / playbackService.playbackRate | date: 'mm:ss' }}
          </p>
        }
      </div>
      <button class="player-controls-button">
        <i class="fas fa-volume disabled-icon"></i>
      </button>
      <button class="player-controls-button" (click)="toggleTwilightBar()">
        <i
          class="twilight-icon"
          [style.--icon]="'url(icons/twilight.svg)'"
          [class.disabled-icon]="!showTwilightBar()"
        >
        </i>
      </button>
    </div>
  </div>
</div>
