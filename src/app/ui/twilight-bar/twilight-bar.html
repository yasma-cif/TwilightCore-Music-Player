<div class="twilight-bar-section">
  <div
    class="twilight-bar-parent"
    (pointerdown)="onPointerDown($event)"
    (pointerup)="onPointerUp($event)"
    (pointermove)="onPointerMove($event)"
  >
    <div #twilightBar class="twilight-bar">
      <svg class="curve" viewBox="0 0 300 140" aria-hidden="true">
        <path d="M16,120 C80,20 220,20 284,120" />
      </svg>
      <i
        class="twilight-bar-thumb fas"
        [class]="thumbIcon()"
        [style.offset-distance.%]="thumbPosition()"
      ></i>
    </div>
    <p class="twilight-value">x{{ twilightBarValue() | number: '.2' }}</p>
  </div>
</div>
